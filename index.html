<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    >
    <meta
      name="description"
      content="A self-hosted viewer for Pi session Gists."
    >
    <title>Pi Share Viewer</title>
    <link rel="stylesheet" href="/src/site.css">
  </head>
  <body class="landing-page">
    <header class="landing-nav">
      <a class="brand" href="/" aria-label="Pi Share Viewer home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Pi Share Viewer</span>
      </a>
      <div class="nav-actions">
        <a
          class="icon-action github-action"
          href="https://github.com/narumiruna/pi-share-viewer"
          target="_blank"
          rel="noreferrer"
          aria-label="View Pi Share Viewer on GitHub"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.73.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"/>
          </svg>
          <span>GitHub</span>
        </a>
        <button
          id="theme-toggle"
          class="icon-action theme-toggle"
          type="button"
          aria-label="Switch to light theme"
          title="Switch to light theme"
        >
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5a8.5 8.5 0 1 0 11.7 11.7Z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="landing-main">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Share Pi sessions.</h1>
        <p class="hero-lead">A self-hosted viewer for <code>/share</code>.</p>
      </section>

      <section id="setup" class="setup-section" aria-labelledby="setup-title">
        <div class="section-heading">
          <h2 id="setup-title">Setup</h2>
        </div>

        <div class="setup-grid">
          <article class="setup-card">
            <span class="step-number">01</span>
            <div>
              <div class="setup-card-header">
                <h3>Set the viewer URL</h3>
                <button
                  class="copy-button"
                  type="button"
                  data-copy-target="setup-command"
                  aria-label="Copy setup command"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="8" y="8" width="11" height="11" rx="2"/>
                    <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
                  </svg>
                  <span>Copy</span>
                </button>
              </div>
              <pre><code id="setup-command">export PI_SHARE_VIEWER_URL="https://your-viewer.example/session/"
pi</code></pre>
            </div>
          </article>
          <article class="setup-card">
            <span class="step-number">02</span>
            <div>
              <div class="setup-card-header">
                <h3>Share</h3>
                <button
                  class="copy-button"
                  type="button"
                  data-copy-target="share-command"
                  aria-label="Copy share command"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="8" y="8" width="11" height="11" rx="2"/>
                    <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
                  </svg>
                  <span>Copy</span>
                </button>
              </div>
              <pre><code id="share-command">/share</code></pre>
            </div>
          </article>
        </div>
      </section>

      <aside class="privacy-notice">
        <p>Secret Gists are unlisted, not private.</p>
      </aside>
    </main>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
